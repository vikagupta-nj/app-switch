<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Deep link vs universal link (in iframe modal)</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      padding: 24px;
    }

    button {
      font-size: 16px;
      padding: 12px 16px;
    }

    #dl-ul-popup[hidden] {
      display: none;
    }

    #dl-ul-popup {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.45);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    #dl-ul-popup-content {
      background: #fff;
      width: min(90vw, 720px);
      height: min(80vh, 700px);
      padding: 16px;
      border-radius: 12px;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.25);
    }

    #dl-ul-iframe {
      width: 100%;
      height: calc(100% - 52px);
      border: 1px solid #ccc;
    }
  </style>
</head>
<body>
  <p><a href="home.html">&larr; Back to home</a></p>
  <h1>Deep link vs universal link (in iframe modal)</h1>
  <p>
    <button id="open-dl-ul">Open deep link vs universal link</button>
  </p>

  <div id="dl-ul-popup" hidden>
    <div id="dl-ul-popup-content">
      <p><button id="close-dl-ul">Close</button></p>
      <iframe id="dl-ul-iframe" title="Deep link vs universal link"></iframe>
    </div>
  </div>

  <script>
    const popup = document.getElementById("dl-ul-popup");
    const iframe = document.getElementById("dl-ul-iframe");
    const IFRAME_SRC = "dl-vs-ul.html";

    document.getElementById("open-dl-ul").addEventListener("click", () => {
      popup.hidden = false;
      iframe.src = IFRAME_SRC;
    });

    document.getElementById("close-dl-ul").addEventListener("click", () => {
      popup.hidden = true;
      iframe.src = "";
    });
  </script>
</body>
</html>
