<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Merchant POC</title>
  <style>
    body {
      font-family: sans-serif;
      padding: 24px;
    }

    #checkout-popup[hidden] {
      display: none;
    }

    #checkout-popup {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.45);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    #checkout-popup-content {
      background: #fff;
      width: min(90vw, 720px);
      height: min(80vh, 700px);
      padding: 16px;
      border-radius: 12px;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.25);
    }

    #checkout-iframe {
      width: 100%;
      height: calc(100% - 52px);
      border: 1px solid #ccc;
    }
  </style>
</head>
<body>
  <h1>Merchant Page</h1>
  <p>
    <button id="open-checkout">Open checkout iframe</button>
  </p>
  <p>
    <a href="paypal-app-switch-checkout://">
      Open PayPal via deep link scheme
    </a>
  </p>

  <div id="checkout-popup" hidden>
    <div id="checkout-popup-content">
      <p><button id="close-checkout">Close checkout popup</button></p>
      <iframe
        id="checkout-iframe"
        title="Checkout iframe"
      ></iframe>
    </div>
  </div>

  <script>
    const popup = document.getElementById("checkout-popup");
    const iframe = document.getElementById("checkout-iframe");

    document.getElementById("open-checkout").addEventListener("click", () => {
      popup.hidden = false;
      iframe.src = "https://vikagupta-nj.github.io/app-switch/webview/iframe.html";
    });

    document.getElementById("close-checkout").addEventListener("click", () => {
      popup.hidden = true;
      iframe.src = "";
    });
  </script>
</body>
</html>
